services:
  app:
    image: docker.io/serhiicho/englitopia:app
    build:
      dockerfile: services/app/Dockerfile
    volumes:
      - ./services/app/src:/var/www/html:z
    ports:
      - 7000:80
    working_dir: /var/www/html
    depends_on:
      - db

  db:
    image: docker.io/serhiicho/englitopia:db
    build:
      dockerfile: services/db/Dockerfile
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    volumes:
      db_vol:/var/lib/mysql:z
    environment:
      MYSQL_ROOT_PASSWORD: 111111
      MYSQL_DATABASE: englitopia

volumes:
  db_vol:
    driver: local
